<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Yoguri</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f2;--card:#fff;--tx:#1d2a1f;--mu:#6b7a6d;--g:#1f5a2e;--gl:#e4f0e2;--or:#d9480f;--ol:#fde8dd;--bd:#d9e2d6;--ok:#1b7f3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--tx:#e8efe6;--mu:#94a597;--g:#7fcf8f;--gl:#24382a;--or:#ff8a5c;--ol:#3a2418;--bd:#2f4034;--ok:#6fd48a}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1b261e;--tx:#e8efe6;--mu:#94a597;--g:#7fcf8f;--gl:#24382a;--or:#ff8a5c;--ol:#3a2418;--bd:#2f4034;--ok:#6fd48a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Nunito,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 10px;font-weight:800;color:var(--g)}h2{font-size:16px;margin:0 0 8px;font-weight:800}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:0}
label{font-size:12px;color:var(--mu);font-weight:600;display:block;margin:6px 0 2px}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--gl);color:var(--g)}
button.p{background:var(--g);color:var(--bg)}button.w{background:#1fa855;color:#fff}button.d{background:var(--ol);color:var(--or)}
button.s{padding:5px 9px;font-size:13px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:var(--card);border:1px solid var(--bd)}.tabs button.on{background:var(--g);color:var(--bg)}
.lv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;background:var(--g);color:var(--bg);padding:2px 10px;border-radius:99px;font-weight:800}
.hint{color:var(--mu);font-size:13px}.warn{color:var(--or);font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px 2px;text-align:left;vertical-align:top}th{color:var(--mu);font-size:12px}
.r{text-align:right;white-space:nowrap}.tot td{border-top:1px dashed var(--bd);font-weight:800;padding-top:6px}
.profit{color:var(--ok);font-weight:800}.nota{border-style:dashed}
.paid{background:var(--gl);color:var(--ok);padding:1px 8px;border-radius:99px;font-size:12px;font-weight:800}.unpaid{background:var(--ol);color:var(--or);padding:1px 8px;border-radius:99px;font-size:12px;font-weight:800}
.wrap{overflow-x:auto}.big{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.grid div{background:var(--gl);border-radius:10px;padding:8px}.grid span{display:block;font-size:12px;color:var(--mu)}
</style></head><body><main>
<h1>Order Yoguri</h1>
<div id="msg" class="warn"></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Pesanan</button><button id="t2" onclick="tab(2)">Laporan</button></div>

<section id="v1">
 <div class="card">
  <div class="row"><select id="bsel" onchange="S.cur=this.value;save();draw()"></select><button class="p" onclick="newBatch()">+ Open order baru</button></div>
  <div id="lvinfo" style="margin-top:10px"></div>
 </div>
 <div class="card">
  <h2 id="ftitle">Pesanan baru</h2>
  <div class="row"><div><label>Nama</label><input id="nama"></div><div><label>No. WA</label><input id="wa" inputmode="tel" placeholder="0857..."></div></div>
  <div class="row"><div style="flex:0 1 150px"><label>Metode antar</label><select id="met" onchange="metChg()"><option>COD</option><option>GoSend</option></select></div><div style="flex:2 1 200px"><label id="loklbl">Lokasi COD (titik ketemu)</label><input id="lok" placeholder="Contoh: depan Indomaret Dago"></div></div>
  <label>Tambah item</label>
  <select id="prod"></select>
  <div class="row"><div><label>Jumlah</label><input id="qty" type="number" min="1" value="1"></div><div><label>Harga jual satuan</label><input id="hj" type="number" min="0"></div><div><label>Rasa / catatan</label><input id="note"></div></div>
  <div style="margin-top:8px"><button class="p" onclick="addItem()">Tambah ke pesanan</button></div>
  <div id="fitems" class="wrap" style="margin-top:8px"></div>
  <div class="row" style="margin-top:8px"><button class="p" onclick="saveOrder()">Simpan pesanan</button><button onclick="resetForm()">Kosongkan</button></div>
 </div>
 <div id="orders"></div>
 <div id="sup"></div>
 <div class="card"><h2>Pembayaran (QRIS)</h2><div class="row" style="align-items:flex-start"><img id="qimg" alt="QRIS Moodvit" style="max-width:200px;border-radius:8px;border:1px solid var(--bd);flex:0 0 auto"><div style="flex:1 1 200px"><p class="hint" style="margin-top:0">QRIS MOODVIT - RESTAURANTS ikut tertulis di nota. Tombol Kirim + QRIS melampirkan gambarnya.</p><button class="s" onclick="saveQR()">Unduh QRIS</button><label>Info tambahan di nota (opsional, misal rekening)</label><textarea id="pay" rows="2" oninput="S.pay=this.value;save()"></textarea></div></div></div>
</section>

<section id="v2" hidden>
 <div class="card"><h2>Rekap bulanan</h2><div class="row"><select id="msel" onchange="drawLap()"></select><button class="p" onclick="exportXlsx()">Unduh Excel bulan ini</button></div><div id="mrec" style="margin-top:10px"></div></div>
 <div id="lap"></div>
</section>
</main>

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>new Date(d+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const cb=()=>S.batches.find(b=>b.id===S.cur);

// hitung
const liters=b=>b.orders.reduce((a,o)=>a+o.items.reduce((s,i)=>s+P[i.p][2]*i.q,0),0);
const level=L=>L>15?3:L>=6?2:L>=3?1:0;
const unitCost=(p,lv)=>P[p][3+Math.max(lv,1)];
function calc(o,lv){let tot=0,cost=0;o.items.forEach(i=>{tot+=i.price*i.q;cost+=unitCost(i.p,lv)*i.q});return{tot,cost,profit:tot-cost}}
function sumB(b){const L=liters(b),lv=level(L);let t=0,c=0,paid=0;b.orders.forEach(o=>{const x=calc(o,lv);t+=x.tot;c+=x.cost;if(o.paid)paid+=x.tot});return{L,lv,t,c,u:t-c,paid,n:b.orders.length}}

function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":"";if(n===2)drawLap()}
function newBatch(){const b={id:uid(),date:today(),orders:[]};S.batches.unshift(b);S.cur=b.id;save();draw()}
function delBatch(id){if(armed!=="b"+id){armed="b"+id;drawLap();return}armed=null;S.batches=S.batches.filter(b=>b.id!==id);if(S.cur===id)S.cur=S.batches[0]?.id||"";save();draw();drawLap()}

function initProd(){let h="",g="";P.forEach((p,i)=>{if(p[0]!==g){if(g)h+="</optgroup>";h+=`<optgroup label="${p[0]}">`;g=p[0]}h+=`<option value="${i}">${E(p[1])} (${R(p[3])})</option>`});$("prod").innerHTML=h+"</optgroup>";$("prod").onchange=()=>$("hj").value=P[$("prod").value][3];$("hj").value=P[0][3]}

function draw(){
 if(!S.batches.length)newBatch();
 if(!cb())S.cur=S.batches[0].id;
 $("bsel").innerHTML=S.batches.map(b=>`<option value="${b.id}" ${b.id===S.cur?"selected":""}>Open order ${fd(b.date)} (${b.orders.length} pesanan)</option>`).join("");
 const b=cb(),s=sumB(b);
 const nx=s.lv===0?3:s.lv===1?6:s.lv===2?15.01:null;
 let hint=s.lv===0?`Belum masuk level, dihitung pakai harga Level 1. Kurang ${(3-s.L).toFixed(2)} L untuk Level 1.`:nx?`Tambah ${(nx-s.L).toFixed(2)} L lagi untuk naik ke Level ${s.lv+1}.`:"Level tertinggi tercapai.";
 $("lvinfo").innerHTML=`<div class="lv"><div><span class="big">${s.L.toFixed(2)} L</span> <span class="badge">${s.lv?"Level "+s.lv:"Belum level"}</span><div class="hint">${hint}</div></div><div style="text-align:right"><div class="hint">Estimasi untung hari ini</div><div class="big profit">${R(s.u)}</div></div></div>`;
 $("pay").value=S.pay||"";
 drawForm();drawOrders();drawSup();
}
function drawForm(){
 $("fitems").innerHTML=draft.length?`<table>${draft.map((i,k)=>`<tr><td>${i.q}x ${E(P[i.p][1])} <span class="hint">${E(P[i.p][0])}${i.note?" · "+E(i.note):""}</span></td><td class="r">${R(i.price*i.q)}</td><td class="r"><button class="d s" onclick="draft.splice(${k},1);drawForm()">Hapus</button></td></tr>`).join("")}<tr class="tot"><td>Total</td><td class="r">${R(draft.reduce((a,i)=>a+i.price*i.q,0))}</td><td></td></tr></table>`:`<span class="hint">Belum ada item. Pilih produk lalu tekan Tambah.</span>`;
}
function metChg(){$("loklbl").textContent=$("met").value==="COD"?"Lokasi COD (titik ketemu)":"Alamat tujuan GoSend"}
function toast(t){$("msg").textContent=t;setTimeout(()=>{$("msg").textContent=""},8000)}
function toBlob(u,t){const a=atob(u.split(",")[1]),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return new Blob([n],{type:t})}
async function dlFile(name,data,fallback){let d=null;try{if(window.claude&&claude.use)d=await claude.use("downloads")}catch(e){}
 if(d){try{await d.save({filename:name,data})}catch(e){if(e&&e.code!=="declined")toast("Gagal mengunduh: "+(e.message||e.code))}}else fallback()}
function saveQR(){dlFile("QRIS-Moodvit.jpg",toBlob(QRIS,"image/jpeg"),()=>{const a=document.createElement("a");a.href=QRIS;a.download="QRIS-Moodvit.jpg";a.click()})}
async function sendQR(id){const b=cb(),o=b.orders.find(x=>x.id===id);
 try{const f=new File([toBlob(QRIS,"image/jpeg")],"QRIS-Moodvit.jpg",{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:waText(o,b)});return}}catch(e){if(e&&e.name==="AbortError")return}
 toast("Kirim gambar langsung tidak didukung di sini. Nota dibuka di WA, lampirkan QRIS yang diunduh.");saveQR();sendWA(id)}
function addItem(){const q=+$("qty").value,price=+$("hj").value;if(!(q>0))return;draft.push({p:+$("prod").value,q,price:price||0,note:$("note").value.trim()});$("qty").value=1;$("note").value="";drawForm()}
function resetForm(){draft=[];editId=null;["nama","wa","lok","note"].forEach(i=>$(i).value="");$("met").value="COD";metChg();$("ftitle").textContent="Pesanan baru";drawForm()}
function saveOrder(){
 if(!$("nama").value.trim()){$("nama").focus();return}
 if(!draft.length){$("prod").focus();return}
 const b=cb(),o={id:editId||uid(),nama:$("nama").value.trim(),wa:$("wa").value.trim(),metode:$("met").value,lok:$("lok").value.trim(),items:draft,paid:false};
 const i=b.orders.findIndex(x=>x.id===editId);
 if(i>=0){o.paid=b.orders[i].paid;b.orders[i]=o}else b.orders.push(o);
 save();resetForm();draw();
}
function editOrder(id){const o=cb().orders.find(x=>x.id===id);editId=id;draft=o.items.map(i=>({...i}));$("nama").value=o.nama;$("wa").value=o.wa;$("met").value=o.metode||"COD";metChg();$("lok").value=o.lok;$("ftitle").textContent="Ubah pesanan: "+o.nama;drawForm();$("nama").scrollIntoView({behavior:"smooth"})}
function delOrder(id){if(armed!==id){armed=id;drawOrders();return}armed=null;const b=cb();b.orders=b.orders.filter(o=>o.id!==id);save();draw()}
function togglePaid(id){const o=cb().orders.find(x=>x.id===id);o.paid=!o.paid;save();draw()}
function waText(o,b){
 const x=calc(o,0);
 return `*NOTA PEMESANAN YOGURT - MOODVIT*\n${fd(b.date)}\n\nNama: ${o.nama}\nPengantaran: ${o.metode==="GoSend"?"GoSend ke":"COD di"} ${o.lok||"-"}\n\n`+o.items.map(i=>`${i.q}x ${P[i.p][1]} (${P[i.p][0]})${i.note?" - "+i.note:""}\n   ${R(i.price)} x ${i.q} = ${R(i.price*i.q)}`).join("\n")+`\n\n*TOTAL: ${R(x.tot)}*\n\n`+`Pembayaran via QRIS (MOODVIT - RESTAURANTS), gambar QRIS dikirim bersama pesan ini.\n`+(S.pay?`${S.pay}\n`:"")+"\n"+`Mohon konfirmasi pesanan dan kirim bukti bayar ya. Terima kasih!`;
}
function sendWA(id){const b=cb(),o=b.orders.find(x=>x.id===id);let n=o.wa.replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);window.open("https://wa.me/"+n+"?text="+encodeURIComponent(waText(o,b)),"_blank")}
function drawOrders(){
 const b=cb(),lv=level(liters(b));
 $("orders").innerHTML=b.orders.length?b.orders.map(o=>{const x=calc(o,lv);return `<div class="card nota"><div class="lv"><div><b>${E(o.nama)}</b> <span class="${o.paid?"paid":"unpaid"}">${o.paid?"Lunas":"Belum bayar"}</span><div class="hint">${o.metode?"<b>"+o.metode+"</b>: ":""}${E(o.lok)||"Lokasi belum diisi"}${o.wa?" · "+E(o.wa):""}</div></div></div>
 <div class="wrap"><table><tr><th>Item</th><th class="r">Jual</th><th class="r">Beli</th><th class="r">Untung</th></tr>${o.items.map(i=>{const c=unitCost(i.p,lv)*i.q,j=i.price*i.q;return `<tr><td>${i.q}x ${E(P[i.p][1])}<div class="hint">${E(P[i.p][0])}${i.note?" · "+E(i.note):""}</div></td><td class="r">${R(j)}</td><td class="r">${R(c)}</td><td class="r profit">${R(j-c)}</td></tr>`}).join("")}<tr class="tot"><td>Total</td><td class="r">${R(x.tot)}</td><td class="r">${R(x.cost)}</td><td class="r profit">${R(x.profit)}</td></tr></table></div>
 <div class="row" style="margin-top:8px"><button class="w s" onclick="sendWA('${o.id}')" ${o.wa?"":"disabled"}>Kirim nota WA</button><button class="w s" onclick="sendQR('${o.id}')">Kirim + QRIS</button><button class="s" onclick="togglePaid('${o.id}')">${o.paid?"Tandai belum bayar":"Tandai lunas"}</button><button class="s" onclick="editOrder('${o.id}')">Ubah</button><button class="d s" onclick="delOrder('${o.id}')">${armed===o.id?"Yakin hapus?":"Hapus"}</button></div></div>`}).join(""):`<div class="card hint">Belum ada pesanan di open order ini.</div>`;
}
function supRows(b){const lv=level(liters(b)),m={};b.orders.forEach(o=>o.items.forEach(i=>{const n=(i.note||"").trim(),k=i.p+"|"+n.toLowerCase();m[k]=m[k]||{p:i.p,note:n,q:0};m[k].q+=i.q}));return{lv,rows:Object.values(m).sort((a,b)=>a.p-b.p||a.note.localeCompare(b.note))}}
function supTotal(b){const{lv,rows}=supRows(b);return rows.reduce((a,r)=>a+unitCost(r.p,lv)*r.q,0)}
function supText(b){const{lv,rows}=supRows(b);let g="",t=`*REKAP ORDER YOGURT - MOODVIT*\nTanggal: ${fd(b.date)}\nTotal: ${liters(b).toFixed(2)} liter\nLevel reseller: ${lv?"Level "+lv:"belum mencapai Level 1"}\n`;rows.forEach(r=>{const p=P[r.p];if(p[0]!==g){g=p[0];t+=`\n*${g}*\n`}t+=`- ${r.q}x ${p[1]}${r.note?" ("+r.note+")":""}\n`});return t+`\nEstimasi tagihan: ${R(supTotal(b))}\nMohon konfirmasi ketersediaan dan total tagihannya. Terima kasih!`}
function drawSup(){const b=cb(),{lv,rows}=supRows(b);if(!rows.length){$("sup").innerHTML="";return}
 let g="",h="";rows.forEach(r=>{const p=P[r.p],u=unitCost(r.p,lv);if(p[0]!==g){g=p[0];h+=`<tr><td colspan="3"><b>${g}</b></td></tr>`}h+=`<tr><td>${r.q}x ${E(p[1])}${r.note?` <span class="hint">${E(r.note)}</span>`:""}</td><td class="r">${u?R(u):"-"}</td><td class="r">${u?R(u*r.q):"-"}</td></tr>`});
 $("sup").innerHTML=`<div class="card"><h2>Rekap untuk supplier</h2><div class="hint">${liters(b).toFixed(2)} L · ${lv?"Level "+lv:"Belum level (pakai harga Level 1)"}</div><div class="wrap"><table><tr><th>Item</th><th class="r">Harga</th><th class="r">Subtotal</th></tr>${h}<tr class="tot"><td>Estimasi tagihan</td><td></td><td class="r">${R(supTotal(b))}</td></tr></table></div><label>No. WA supplier (opsional, tersimpan)</label><input id="supwa" inputmode="tel" value="${E(S.supwa||"")}" oninput="S.supwa=this.value;save()"><div class="row" style="margin-top:8px"><button class="w s" onclick="sendSup()">Kirim ke WA supplier</button><button class="s" onclick="copySup()">Salin teks</button></div></div>`}
function sendSup(){let n=(S.supwa||"").replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);window.open("https://wa.me/"+n+"?text="+encodeURIComponent(supText(cb())),"_blank")}
function copySup(){try{navigator.clipboard.writeText(supText(cb())).then(()=>toast("Teks rekap tersalin."),()=>toast("Gagal menyalin, pakai tombol Kirim ke WA."))}catch(e){toast("Gagal menyalin, pakai tombol Kirim ke WA.")}}
function drawLap(){
 const months=[...new Set(S.batches.map(b=>b.date.slice(0,7)))].sort().reverse();
 if(!months.length)months.push(today().slice(0,7));
 const cur=$("msel").value&&months.includes($("msel").value)?$("msel").value:months[0];
 $("msel").innerHTML=months.map(m=>`<option value="${m}" ${m===cur?"selected":""}>${new Date(m+"-01T00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</option>`).join("");
 const bs=S.batches.filter(b=>b.date.startsWith(cur)).sort((a,b)=>a.date<b.date?1:-1),T={n:0,L:0,t:0,c:0,u:0,paid:0,o:0};
 const rows=bs.map(b=>{const s=sumB(b);T.n++;T.o+=s.n;T.L+=s.L;T.t+=s.t;T.c+=s.c;T.u+=s.u;T.paid+=s.paid;return{b,s}});
 $("mrec").innerHTML=`<div class="grid"><div><span>Open order</span><b>${T.n}</b></div><div><span>Pesanan / liter</span><b>${T.o} / ${T.L.toFixed(1)} L</b></div><div><span>Omzet</span><b>${R(T.t)}</b></div><div><span>Modal beli</span><b>${R(T.c)}</b></div><div><span>Untung</span><b class="profit">${R(T.u)}</b></div><div><span>Sudah dibayar</span><b>${R(T.paid)}</b></div></div>`;
 $("lap").innerHTML=rows.length?rows.map(({b,s})=>`<div class="card"><div class="lv"><div><h2>Open order ${fd(b.date)}</h2><span class="badge">${s.lv?"Level "+s.lv:"Belum level"}</span> <span class="hint">${s.L.toFixed(2)} L · ${s.n} pesanan</span></div><button class="d s" onclick="delBatch('${b.id}')">${armed==="b"+b.id?"Yakin hapus?":"Hapus"}</button></div>
 <div class="grid" style="margin:8px 0"><div><span>Omzet</span><b>${R(s.t)}</b></div><div><span>Modal</span><b>${R(s.c)}</b></div><div><span>Untung</span><b class="profit">${R(s.u)}</b></div><div><span>Belum dibayar</span><b>${R(s.t-s.paid)}</b></div></div>
 <div class="wrap"><table><tr><th>Pelanggan</th><th class="r">Total</th><th class="r">Untung</th><th></th></tr>${b.orders.map(o=>{const x=calc(o,s.lv);return `<tr><td>${E(o.nama)}</td><td class="r">${R(x.tot)}</td><td class="r profit">${R(x.profit)}</td><td class="r"><span class="${o.paid?"paid":"unpaid"}">${o.paid?"Lunas":"Belum"}</span></td></tr>`}).join("")}</table></div></div>`).join(""):`<div class="card hint">Belum ada open order di bulan ini.</div>`;
}
$("qimg").src=QRIS;function exportXlsx(){
 const m=$("msel").value,bs=S.batches.filter(b=>b.date.startsWith(m)).sort((a,b)=>a.date<b.date?-1:1);
 if(!bs.length){toast("Belum ada data di bulan ini.");return}
 const A=[["Tanggal open order","Pesanan","Liter","Level","Omzet","Modal beli","Untung","Sudah dibayar","Belum dibayar"]],D=[["Tanggal","Nama","No. WA","Metode antar","Lokasi","Varian","Kemasan","Qty","Liter","Harga jual","Harga beli","Total jual","Total beli","Untung","Level","Status"]];
 let T=[0,0,0,0,0,0,0];
 bs.forEach(b=>{const s=sumB(b);A.push([b.date,s.n,+s.L.toFixed(2),s.lv||"Belum level",s.t,s.c,s.u,s.paid,s.t-s.paid]);[s.n,s.L,s.t,s.c,s.u,s.paid,s.t-s.paid].forEach((v,i)=>T[i]+=v);
  b.orders.forEach(o=>o.items.forEach(i=>{const c=unitCost(i.p,s.lv);D.push([b.date,o.nama,o.wa,o.metode||"",o.lok,P[i.p][1]+(i.note?" ("+i.note+")":""),P[i.p][0],i.q,+(P[i.p][2]*i.q).toFixed(2),i.price,c,i.price*i.q,c*i.q,(i.price-c)*i.q,s.lv||"Belum level",o.paid?"Lunas":"Belum bayar"])}))});
 A.push(["TOTAL",T[0],+T[1].toFixed(2),"",T[2],T[3],T[4],T[5],T[6]]);
 const wb=XLSX.utils.book_new();
 [["Rekap per open order",A],["Detail item",D]].forEach(([n,r])=>{const ws=XLSX.utils.aoa_to_sheet(r);ws["!cols"]=r[0].map((_,i)=>({wch:i===5||i===4?30:16}));XLSX.utils.book_append_sheet(wb,ws,n)});
 const fn="Laporan-Yoguri-"+m+".xlsx";
 dlFile(fn,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]),()=>XLSX.writeFile(wb,fn));
}
initProd();draw();
</script></body></html>
